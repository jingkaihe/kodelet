name: Test and Lint

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  test:
    name: Tests & Linting
    runs-on: kodelet-runner

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install C toolchain for Go race tests
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Setup mise
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: false # Tools cached on PVC at /home/runner/.local/share/mise
          experimental: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: mise run install
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Code generation
        run: mise run code-generation

      - name: Lint Go code
        run: mise run lint

      - name: Test Go code
        run: mise run test

      - name: Test TypeScript SDK
        run: mise run sdk-test

      - name: Lint Go SDK
        run: mise run sdk-go-lint

      - name: Test Go SDK
        run: mise run sdk-go-test

      - name: Lint MCP extension
        run: mise run mcp-lint

      - name: Test MCP extension
        run: mise run mcp-test

      - name: Test TypeScript and Go SDKs across process boundaries
        run: mise run sdk-acceptance

      - name: Lint frontend (Biome)
        run: mise run frontend-lint

      - name: Test frontend code
        run: mise run frontend-test

      - name: Verify build
        run: mise run build

      - name: Verify cross compilation
        run: mise run release-snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  go-sdk-minimum:
    name: Go SDK / minimum Go version
    runs-on: ubuntu-latest

    permissions:
      contents: read

    defaults:
      run:
        working-directory: sdk/go

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go from sdk/go/go.mod
        uses: actions/setup-go@v5
        with:
          go-version-file: sdk/go/go.mod
          cache-dependency-path: sdk/go/go.sum

      - name: Vet Go SDK
        run: go vet ./...

      - name: Test Go SDK
        run: go test -race ./...
