name: Native audio builds

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - audio/**
      - mise.toml
      - .goreleaser.yaml
      - .github/workflows/audio.yml
      - .github/workflows/release.yml
      - scripts/run-github-release.sh
  push:
    branches: [main]
    paths:
      - audio/**
      - mise.toml
      - .goreleaser.yaml
      - .github/workflows/audio.yml
      - .github/workflows/release.yml
      - scripts/run-github-release.sh

permissions:
  contents: read

jobs:
  build:
    name: Audio / ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-amd64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
          - runner: macos-15-intel
            target: darwin-amd64
          - runner: macos-15
            target: darwin-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Setup mise
        uses: jdx/mise-action@v2
        with:
          install: false

      - name: Install Linux audio dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config libasound2-dev libopus-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good

      - name: Install macOS audio dependencies
        if: runner.os == 'macOS'
        run: brew install cmake pkgconf opus gstreamer

      - name: Lint audio helper
        run: mise run audio-lint

      - name: Test audio without devices or providers
        run: mise run audio-test

      - name: Build release binary
        run: mise run audio-package

      - name: Check native artifact
        env:
          AUDIO_TARGET: ${{ matrix.target }}
        run: |
          binary=".build/audio/kodelet-audio-$AUDIO_TARGET"
          test -x "$binary"
          file "$binary"
          "$binary" --version

      - name: Upload release binary
        uses: actions/upload-artifact@v4
        with:
          name: kodelet-audio-${{ matrix.target }}
          path: .build/audio/kodelet-audio-${{ matrix.target }}
          include-hidden-files: true
          if-no-files-found: error
